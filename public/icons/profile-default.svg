<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Clip-path untuk memastikan bagian badan terpotong sempurna sesuai lingkaran luar -->
    <clipPath id="avatar-clip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
  </defs>
  
  <!-- Latar belakang lingkaran warna ungu muda -->
  <circle cx="256" cy="256" r="256" fill="#E6E0FF" />
  
  <!-- Bagian ikon avatar (Kepala & Badan) -->
  <g clip-path="url(#avatar-clip)">
    <!-- Kepala -->
    <circle cx="256" cy="190" r="100" fill="#5E2BF0" />
    
    <!-- Badan / Bahu -->
    <ellipse cx="256" cy="450" rx="180" ry="115" fill="#5E2BF0" />
  </g>
</svg>
